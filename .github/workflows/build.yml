name: Build SUJON MASTER APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip project and build debug APK
        run: |
          ls -la
          for f in *.zip; do echo "Unzipping $f"; unzip -o "$f" || true; done
          ls -la
          if [ -f sujon-master-android.zip ]; then unzip -o sujon-master-android.zip; fi
          ls -la
          sed -i 's/import com.google.api.client.extensions.android.http.AndroidHttp/import com.google.api.client.http.javanet.NetHttpTransport/' app/src/main/java/com/worksledger/app/sync/GoogleDriveSyncManager.kt || true
          sed -i 's/AndroidHttp.newCompatibleTransport()/NetHttpTransport()/' app/src/main/java/com/worksledger/app/sync/GoogleDriveSyncManager.kt || true
          sed -i 's/import com.google.api.client.extensions.android.http.AndroidHttp/import com.google.api.client.http.javanet.NetHttpTransport/' android/app/src/main/java/com/worksledger/app/sync/GoogleDriveSyncManager.kt || true
          sed -i 's/AndroidHttp.newCompatibleTransport()/NetHttpTransport()/' android/app/src/main/java/com/worksledger/app/sync/GoogleDriveSyncManager.kt || true
          
          if [ -f gradlew ]; then
            echo "sdk.dir=$ANDROID_HOME" >> local.properties
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f android/gradlew ]; then
            cd android
            echo "sdk.dir=$ANDROID_HOME" >> local.properties
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found"
            ls -R | head -n 100
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sujon-master-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Show debug SHA-1
        run: |
         APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
         "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk


